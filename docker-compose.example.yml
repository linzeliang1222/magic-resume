version: '3.8'

services:
  magic-resume:
    build: .
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - DOCKER=true
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
    # 如果需要额外的权限来运行Chromium，可以添加以下配置
    # cap_add:
    #   - SYS_ADMIN
    # security_opt:
    #   - seccomp:unconfined
    volumes:
      # 如果需要持久化某些数据，可以添加卷
      - ./public:/app/public:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s